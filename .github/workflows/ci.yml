name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Start the stack (worker interval 2s for tests)
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/docs > /dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in 60s"
          docker compose logs
          exit 1

      - name: Run tests
        run: pytest -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
